[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "chameleon-ai"
version = "0.2.0"
description = "Private local AI for real Windows shells"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
dependencies = ["pydantic==2.12.5", "httpx==0.28.1", "psutil==7.2.2", "tomli-w==1.2.0", "PySide6==6.10.2", "pywinpty==3.0.5; sys_platform == 'win32'"]

[project.scripts]
chameleon-core = "chameleon.cli:main"

[project.gui-scripts]
chameleon-terminal = "chameleon.terminal.app:main"
chameleon-setup = "chameleon.setup.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chameleon = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: real Windows integration", "ollama: optional real local model", "gui: Qt WebEngine smoke"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
